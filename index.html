<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-touch-fullscreen" content="yes" />
    <title>Tamboia</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="calc-container">
      <div class="game-info left">
        <span id="level-display">nível: 1</span>
      </div>

      <div class="calc">
        <div class="left-number">
          <span>?</span>
        </div>
        <span>x</span>
        <div class="right-number">
          <span>?</span>
        </div>
      </div>

      <div class="game-info right">
        <span id="score-display">0 pts</span>
      </div>
    </header>
    <main>
      <canvas id="screen"></canvas>

      <div id="game-over" class="game-over hidden">
        <h2>Fim de Jogo</h2>
        <p id="final-score">0 pts</p>
        <button id="restart-btn" class="restart-btn">Jogar Novamente</button>
      </div>
    </main>

    <footer class="controls">
      <button class="ctrl-btn left" data-direction="ArrowLeft">
        <span>⇐</span>
      </button>
      <div class="ctrl-container up-down">
        <button class="ctrl-btn up" data-direction="ArrowUp">
          <span>⇑</span>
        </button>
        <button class="ctrl-btn down" data-direction="ArrowDown">
          <span>⇓</span>
        </button>
      </div>
      <button class="ctrl-btn right" data-direction="ArrowRight">
        <span>⇒</span>
      </button>
    </footer>
  </body>

  <script>
    function getPixelValue(width, height) {
      let widthDiv = 16
      let heightDiv = 9

      if (width > 1360) widthDiv *= 3
      if (height > 600) heightDiv *= 3

      return Math.min(
        Math.floor(width / widthDiv),
        Math.floor(height / heightDiv)
      )
    }

    const main = document.body.querySelector('main'),
      bodyWidth = main.offsetWidth,
      bodyHeight = main.offsetHeight
    const PIXEL = getPixelValue(bodyWidth, bodyHeight),
      CANVAS = document.body.querySelector('main > #screen'),
      CTX = CANVAS.getContext('2d'),
      levelDisplay = document.getElementById('level-display'),
      scoreDisplay = document.getElementById('score-display'),
      gameOverDisplay = document.getElementById('game-over'),
      finalScoreDisplay = document.getElementById('final-score'),
      restartButton = document.getElementById('restart-btn'),
      leftNumber = document.querySelector('.left-number span'),
      rightNumber = document.querySelector('.right-number span')

    const COLS = Math.floor(bodyWidth / PIXEL)
    const ROWS = Math.floor(bodyHeight / PIXEL)
    CANVAS.width = COLS * PIXEL
    CANVAS.height = ROWS * PIXEL

    // snake
    const SNAKE = [
      { x: 3, y: 1 },
      { x: 2, y: 1 },
      { x: 1, y: 1 },
    ]

    CTX.strokeStyle = 'snow'
    CTX.textAlign = 'center'
    CTX.textBaseline = 'middle'
    CTX.font = `${PIXEL / 1.4}px Fredoka`

    function drawSnakeBody(ctx, snake) {
      if (snake.length === 0) return
      ctx.fillStyle = 'darkgreen'
      ctx.fillRect(snake[0].x * PIXEL, snake[0].y * PIXEL, PIXEL, PIXEL)
      ctx.strokeRect(snake[0].x * PIXEL, snake[0].y * PIXEL, PIXEL, PIXEL)
      ctx.fillStyle = 'seagreen'
      for (let i = 1; i < snake.length; i++) {
        const segment = snake[i]
        ctx.fillRect(segment.x * PIXEL, segment.y * PIXEL, PIXEL, PIXEL)
        ctx.strokeRect(segment.x * PIXEL, segment.y * PIXEL, PIXEL, PIXEL)
      }
    }

    let snakeDirection = { x: 1, y: 0 }
    let canChangeDirection = true
    function moveSnake(ctx, snake) {
      canChangeDirection = true

      const head = snake[0]
      let newHead = {
        x: head.x + snakeDirection.x,
        y: head.y + snakeDirection.y,
      }

      if (newHead.x < 0) {
        newHead.x = COLS - 1
      } else if (newHead.x >= COLS) {
        newHead.x = 0
      }

      if (newHead.y < 0) {
        newHead.y = ROWS - 1
      } else if (newHead.y >= ROWS) {
        newHead.y = 0
      }

      if (checkSelfCollision(snake, newHead)) {
        gameOver(snake)
        return
      }

      const tail = snake[snake.length - 1]
      snake.unshift(newHead)
      snake.pop()
      occupancy[getCellIndex(tail.x, tail.y)] = 0
      occupancy[getCellIndex(newHead.x, newHead.y)] = 1
    }

    const directions = {
      ArrowUp: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 },
    }

    function applyDirection(key) {
      const newDir = directions[key]
      if (!newDir) return
      if (newDir.x !== -snakeDirection.x || newDir.y !== -snakeDirection.y) {
        snakeDirection = newDir
        canChangeDirection = false
      }
    }

    function changeSnakeDirection(event) {
      applyDirection(event.key)
    }
    document.addEventListener('keydown', changeSnakeDirection)

    function setDirection(key) {
      applyDirection(key)
    }

    // touch
    let touchStartX = 0
    let touchStartY = 0

    function handleTouchStart(event) {
      const touch = event.changedTouches[0]
      touchStartX = touch.clientX
      touchStartY = touch.clientY
    }

    function handleTouchEnd(event) {
      const touch = event.changedTouches[0]
      const dx = touch.clientX - touchStartX
      const dy = touch.clientY - touchStartY
      const absDx = Math.abs(dx)
      const absDy = Math.abs(dy)

      if (Math.max(absDx, absDy) < 20) return

      if (absDx > absDy) {
        setDirection(dx > 0 ? 'ArrowRight' : 'ArrowLeft')
      } else {
        setDirection(dy > 0 ? 'ArrowDown' : 'ArrowUp')
      }
    }

    document.addEventListener('touchstart', handleTouchStart, { passive: true })
    document.addEventListener('touchend', handleTouchEnd, { passive: true })
    // ---------

    function addNewSnakePart(snake) {
      const lastIndex = snake.length - 1
      const tail = snake[lastIndex]
      const beforeTail = snake[lastIndex - 1]

      const dx = tail.x - beforeTail.x
      const dy = tail.y - beforeTail.y

      const newTail = {
        x: tail.x + dx,
        y: tail.y + dy,
      }
      snake.push(newTail)
      occupancy[getCellIndex(newTail.x, newTail.y)] = 1
    }

    const occupancy = new Uint8Array(COLS * ROWS)

    function getCellIndex(x, y) {
      return y * COLS + x
    }

    function updateSnakeOccupancy(snake) {
      occupancy.fill(0)
      for (let i = 0; i < snake.length; i++) {
        const segment = snake[i]
        occupancy[getCellIndex(segment.x, segment.y)] = 1
      }
    }

    function checkSelfCollision(snake, newHead) {
      return occupancy[getCellIndex(newHead.x, newHead.y)] === 1
    }

    // fruit
    let fruit = null
    let resultFruit = null
    let extraNormalFruits = []
    let values = { a: null, b: null }

    function isOccupied(x, y, snake) {
      if (occupancy[getCellIndex(x, y)] === 1) return true
      for (let i = 0; i < extraNormalFruits.length; i++) {
        if (extraNormalFruits[i].x === x && extraNormalFruits[i].y === y)
          return true
      }
      if (fruit && fruit.x === x && fruit.y === y) return true
      if (resultFruit && resultFruit.x === x && resultFruit.y === y) return true
      return false
    }

    function getEmptyPosition(snake) {
      const totalCells = COLS * ROWS
      const occupiedCount =
        snake.length +
        extraNormalFruits.length +
        (fruit ? 1 : 0) +
        (resultFruit ? 1 : 0)

      if (occupiedCount >= totalCells) return null

      const maxAttempts = Math.min(32, totalCells - occupiedCount)
      for (let i = 0; i < maxAttempts; i++) {
        const x = Math.floor(Math.random() * COLS)
        const y = Math.floor(Math.random() * ROWS)
        if (!isOccupied(x, y, snake)) return { x, y }
      }

      const start = Math.floor(Math.random() * totalCells)
      for (let i = 0; i < totalCells; i++) {
        const index = (start + i) % totalCells
        const x = index % COLS
        const y = Math.floor(index / COLS)
        if (!isOccupied(x, y, snake)) return { x, y }
      }

      return null
    }

    function updateExtraFruits(snake) {
      if (values.a === null || values.b === null) {
        extraNormalFruits = []
        return
      }

      if (values.a === 1 || values.b === 1) {
        extraNormalFruits = []
        return
      }

      const targetCount = getTargetFruitCount(snake)
      let currentTotal = 0
      if (fruit) currentTotal++
      if (resultFruit) currentTotal++
      currentTotal += extraNormalFruits.length

      while (currentTotal < targetCount) {
        const pos = getEmptyPosition(snake)
        if (!pos) break
        const refVal = resultFruit ? resultFruit.value : undefined
        const newF = createFruit(refVal, pos)
        if (!newF) break
        extraNormalFruits.push(newF)
        currentTotal++
      }

      while (currentTotal > targetCount && extraNormalFruits.length > 0) {
        extraNormalFruits.pop()
        currentTotal--
      }
    }

    function createFruit(value, position) {
      let newValue = Math.floor(Math.random() * 9) + 1

      if (value !== undefined) {
        const { a, b } = values

        if (a === 1 && b === 1) {
          return null
        }

        if (a === 0 || a === 1 || b === 0 || b === 1) {
          newValue = a === 0 || b === 0 ? 0 : 1
        } else {
          const candidates = [
            a * (b - 1),
            a * (b + 1),
            (a - 1) * b,
            (a + 1) * b,
            value - 2,
            value + 2,
            value - 4,
            value + 4,
          ]
          const usedValues = new Set()
          for (let i = 0; i < extraNormalFruits.length; i++)
            usedValues.add(extraNormalFruits[i].value)
          if (fruit) usedValues.add(fruit.value)

          let optionCount = 0
          for (let i = 0; i < candidates.length; i++) {
            const candidate = candidates[i]
            if (
              candidate >= 0 &&
              candidate !== value &&
              candidate % 2 === value % 2 &&
              !usedValues.has(candidate)
            ) {
              candidates[optionCount++] = candidate
            }
          }

          if (optionCount > 0) {
            newValue = candidates[Math.floor(Math.random() * optionCount)]
          } else {
            let fallback = value + 2
            while (usedValues.has(fallback) || fallback === value) fallback += 2
            newValue = fallback
          }
        }
      }

      const pos = position || getEmptyPosition(SNAKE)
      if (!pos) return null

      return {
        x: pos.x,
        y: pos.y,
        value: newValue,
      }
    }

    function drawFruit(ctx, fruit) {
      if (!fruit) return
      ctx.fillStyle = '#c33'
      ctx.fillRect(fruit.x * PIXEL, fruit.y * PIXEL, PIXEL, PIXEL)
      ctx.fillStyle = 'snow'
      ctx.fillText(
        fruit.value,
        fruit.x * PIXEL + PIXEL / 2,
        fruit.y * PIXEL + PIXEL / 2
      )
    }

    function hasEatFruit(snake, fruit) {
      if (!fruit) return false
      const head = snake[0]
      if (head.x === fruit.x && head.y === fruit.y) {
        return true
      }
      return false
    }

    function hasEatedFruit(snake) {
      for (let i = 0; i < extraNormalFruits.length; i++) {
        if (hasEatFruit(snake, extraNormalFruits[i])) {
          const eatenVal = extraNormalFruits[i].value
          extraNormalFruits.splice(i, 1)
          if (!values.a) {
            values.a = eatenVal
            updateValues()
          } else if (!values.b) {
            values.b = eatenVal
            updateValues()
          } else if (values.a && values.b && resultFruit) {
            resetValuesAndFruits()
            snake.pop()
            updateValues()
          }
          checkSpeed(snake)
          return
        }
      }

      const eatedFruit = checkEatedFruit(snake, fruit, resultFruit)
      switch (eatedFruit) {
        case 'number-fruit':
          if (!values.a) {
            values.a = fruit.value
            fruit = createFruit()
            updateValues()
            break
          }
          if (!values.b) {
            values.b = fruit.value
            updateValues()
            break
          }

          if (values.a && values.b && resultFruit) {
            resetValuesAndFruits()
            const removedTail = snake.pop()
            if (removedTail)
              occupancy[getCellIndex(removedTail.x, removedTail.y)] = 0
            updateValues()
            break
          }
        case 'result-fruit':
          resetValuesAndFruits()
          addNewSnakePart(snake)
          updateValues()
          break
        default:
          break
      }
      checkSpeed(snake)
    }

    function createResultFruit({ a, b }) {
      const pos = getEmptyPosition(SNAKE)
      if (!pos) return null
      return {
        x: pos.x,
        y: pos.y,
        value: a * b,
      }
    }

    function checkEatedFruit(snake, fruit, resultFruit) {
      if (hasEatFruit(snake, fruit)) return 'number-fruit'
      if (resultFruit && hasEatFruit(snake, resultFruit)) return 'result-fruit'
    }

    function resetValuesAndFruits() {
      values = { a: null, b: null }
      extraNormalFruits = []
      fruit = createFruit()
      resultFruit = null
    }

    // game
    let currentSpeed = 100
    let rafId = null
    let running = false
    let lastTime = 0
    let accumulator = 0

    function startLoop() {
      if (running) return
      running = true
      lastTime = performance.now()
      accumulator = 0
      rafId = requestAnimationFrame(loop)
    }

    function stopLoop() {
      running = false
      if (rafId !== null) cancelAnimationFrame(rafId)
      rafId = null
    }

    function loop(now) {
      if (!running) return
      let delta = now - lastTime
      lastTime = now
      if (delta > 250) delta = 250 // evita salto grande ao voltar de uma aba em background

      accumulator += delta
      while (running && accumulator >= currentSpeed) {
        gameLoop(CTX, SNAKE)
        accumulator -= currentSpeed
      }

      if (running) rafId = requestAnimationFrame(loop)
    }

    function getLevel(snake) {
      const score = Math.max(0, snake.length - 3)
      return Math.floor(score / 15) + 1
    }

    function getTargetFruitCount(snake) {
      const level = getLevel(snake)
      if (level <= 1) return 2
      return Math.min(1 + level, 6)
    }

    function checkSpeed(snake) {
      const level = getLevel(snake)
      const targetSpeed = Math.max(50, 100 - (level - 1) * 5)
      currentSpeed = targetSpeed
    }

    function getRandomIntInclusive(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min
    }

    function resetGame(snake) {
      snake.length = 0
      snake.push({ x: 3, y: 1 }, { x: 2, y: 1 }, { x: 1, y: 1 })
      snakeDirection = { x: 1, y: 0 }
      currentSpeed = 100
      displayedScore = -1
      displayedLevel = -1

      gameOverDisplay.classList.add('hidden')

      resetValuesAndFruits()
      updateSnakeOccupancy(snake)
      updateValues()

      stopLoop()
      startLoop()
    }

    function gameOver(snake) {
      stopLoop()
      showGameOver(snake)
    }

    function gameLoop(ctx, snake) {
      if (snake.length < 3) {
        gameOver(snake)
        return
      }

      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height)
      moveSnake(ctx, snake)
      drawSnakeBody(ctx, snake)
      hasEatedFruit(snake)

      if (values.a !== null && values.b !== null && !resultFruit) {
        resultFruit = createResultFruit({ a: values.a, b: values.b })
        fruit = createFruit(resultFruit.value)
      }

      updateExtraFruits(snake)

      if (fruit) drawFruit(ctx, fruit)
      if (resultFruit) drawFruit(ctx, resultFruit)
      for (let i = 0; i < extraNormalFruits.length; i++) {
        drawFruit(ctx, extraNormalFruits[i])
      }
    }

    // UI
    let displayedScore = -1
    let displayedLevel = -1

    function updateHUD(snake) {
      const score = Math.max(0, snake.length - 3)
      const level = getLevel(snake)

      if (level !== displayedLevel) {
        displayedLevel = level
        levelDisplay.innerText = `nível: ${level}`
      }
      if (score !== displayedScore) {
        displayedScore = score
        scoreDisplay.innerText = `${score} pts`
      }
    }

    function updateValues() {
      const { a, b } = values
      leftNumber.textContent = a === null ? '?' : a
      rightNumber.textContent = b === null ? '?' : b
      updateHUD(SNAKE)
    }

    function showGameOver(snake) {
      const score = Math.max(0, snake.length - 3)
      finalScoreDisplay.innerText = `${score} pts`
      gameOverDisplay.classList.remove('hidden')
    }

    // main
    function init(ctx, snake) {
      resetValuesAndFruits()
      updateSnakeOccupancy(snake)
      updateValues()
      startLoop()
    }

    restartButton.addEventListener('click', () => {
      gameOverDisplay.classList.add('hidden')
      resetGame(SNAKE)
    })

    const controlButtons = document.querySelectorAll(
      '.ctrl-btn[data-direction]'
    )
    controlButtons.forEach((button) => {
      button.addEventListener('click', () =>
        setDirection(button.dataset.direction)
      )
    })

    init(CTX, SNAKE)
  </script>
</html>
