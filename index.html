<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-touch-fullscreen" content="yes" />
    <title>Tamboia</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="calc-container">
      <div class="game-info left">
        <span id="level-display">nível: 1</span>
      </div>

      <div class="calc">
        <div class="left-number">
          <span>?</span>
        </div>
        <span>x</span>
        <div class="right-number">
          <span>?</span>
        </div>
      </div>

      <div class="game-info right">
        <span id="score-display">0 pts</span>
      </div>
    </header>
    <main>
      <canvas id="screen"></canvas>

      <div id="game-over" class="game-over hidden">
        <h2>Fim de Jogo</h2>
        <p id="final-score">0 pts</p>
        <button id="restart-btn" class="restart-btn">Jogar Novamente</button>
      </div>
    </main>

    <footer class="controls">
      <button class="ctrl-btn left" data-direction="ArrowLeft">
        <span>⇐</span>
      </button>
      <div class="ctrl-container up-down">
        <button class="ctrl-btn up" data-direction="ArrowUp">
          <span>⇑</span>
        </button>
        <button class="ctrl-btn down" data-direction="ArrowDown">
          <span>⇓</span>
        </button>
      </div>
      <button class="ctrl-btn right" data-direction="ArrowRight">
        <span>⇒</span>
      </button>
    </footer>
  </body>

  <script src="js/init-config.js"></script>
  <script src="js/snake.js"></script>
  <script src="js/fruit.js"></script>
  <script src="js/game.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/game-ui.js"></script>
  <script>
    function init(snake) {
      resetValuesAndFruits()
      updateSnakeOccupancy(snake)
      updateValues()
      startLoop()
    }

    init(SNAKE)
  </script>
</html>
